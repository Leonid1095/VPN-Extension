services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Свой DNS вместо docker embedded (127.0.0.11): тот форвардит на хостовый
    # upstream, который ~4% запросов отдаёт EAI_AGAIN, отчего падал DonatePay-поллер.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8080:8080"
    # Единственный контейнер на хосте без потолка памяти — на 3.3 ГБ машины это
    # значило, что утечка здесь утащит за собой весь стек, включая выход каскада.
    # Все соседние сервисы ограничены (128–768 МБ). Добавлено 2026-07-26.
    mem_limit: 512m
    memswap_limit: 768m
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
